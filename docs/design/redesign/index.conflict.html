<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foodly Redesign – Ruhig</title>
    <style>
      :root {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 13px;
        color: #222;
        background: #e9e9e9;
      }
      body {
        margin: 0;
      }
      .bar {
        position: sticky;
        top: 0;
        z-index: 2;
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        align-items: center;
        padding: 10px 16px;
        background: #fff;
        border-bottom: 1px solid #ddd;
      }
      .bar b {
        font-size: 14px;
        margin-right: 8px;
      }
      .grp {
        display: inline-flex;
        background: #eee;
        border-radius: 8px;
        padding: 3px;
        gap: 2px;
      }
      .grp button {
        border: 0;
        background: transparent;
        padding: 5px 10px;
        border-radius: 6px;
        font: inherit;
        cursor: pointer;
        color: #555;
      }
      .grp button.on {
        background: #fff;
        color: #111;
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.12);
      }
      .stage {
        display: flex;
        gap: 24px;
        padding: 24px;
        align-items: flex-start;
        flex-wrap: wrap;
      }
      .frame {
        flex: none;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .frame span {
        color: #666;
        font-weight: 600;
      }
      iframe {
        border: 0;
        background: #fff;
        border-radius: 10px;
        box-shadow: 0 4px 24px rgb(0 0 0 / 0.12);
      }
      .phone iframe {
        border-radius: 28px;
      }
      .about {
        max-width: 860px;
        padding: 0 24px 40px;
        line-height: 1.55;
        color: #444;
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <b>Foodly Redesign</b>
      <div class="grp" id="theme"><button data-v="light">Hell</button><button data-v="dark">Dunkel</button></div>
      <div class="grp" id="img">
        <button data-v="1">Mit Fotos</button><button data-v="0">Ohne Fotos (heute)</button>
      </div>
      <div class="grp" id="dev">
        <button data-v="both">Desktop + Handy</button><button data-v="desk">Desktop</button
        ><button data-v="phone">Handy</button>
      </div>
      <div class="grp" id="view" title="Rezeptliste: Ansicht">
        <button data-v="compact">Kompakt</button><button data-v="detailed">Detailliert</button
        ><button data-v="tiles">Kacheln</button>
      </div>
      <div class="grp" id="screen"></div>
    </div>
    <div class="stage" id="stage"></div>
    <script>
      // Screen buttons: [key, label, app screen, extra query]
      const SCREENS = [
        ['home', 'Start', 'home'],
        ['list', 'Rezepte', 'list'],
        ['listf', 'Rezepte gefiltert', 'listf'],
        ['filter', 'Filter: Tags', 'listf', 'sheet=f-tag'],
        ['viewsheet', 'Sortieren-Sheet', 'list', 'sheet=view'],
        ['category', 'Kategorie', 'category'],
        ['detail', 'Detail', 'detail'],
        ['detail2', 'Detail ohne Kat.', 'detail2'],
        ['lightbox', 'Fotos groß', 'detail', 'lb=1'],
        ['timer', 'Timer', 'timer'],
        ['cook', 'Kochen', 'cook'],
        ['editor', 'Editor', 'editor'],
        ['editor-ing', 'Editor: Zutat (Handy)', 'editor', 'sheet=ing'],
        ['planner', 'Planer', 'planner'],
        ['shopping', 'Einkauf', 'shopping'],
        ['shop-lists', 'Einkauf: Listen (Handy)', 'shopping', 'sheet=lists'],
        ['groups', 'Gruppen', 'groups'],
        ['profile', 'Profil', 'profile'],
        ['categories', 'Kategorien', 'categories'],
        ['states', 'Zustände', 'states'],
      ]
      document.getElementById('screen').innerHTML = SCREENS.map(([k, l]) => `<button data-v="${k}">${l}</button>`).join(
        '',
      )
      const st = Object.assign(
        { theme: 'light', img: '1', dev: 'both', view: 'detailed', screen: 'home' },
        Object.fromEntries(new URLSearchParams(location.hash.slice(1))),
      )
      // srcdoc instead of src: the platform forbids embedding its pages via response headers (Firefox blocks them).
      const V = Date.now() // cache-buster: always load the current mockup files
      const abs = (f) => new URL(f, location.href).href + '?v=' + V
      const frameDoc = (q) =>
        `<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">${['base', 'dir-a', 'screens'].map((f) => `<link rel="stylesheet" href="${abs(f + '.css')}">`).join('')}</head><body><div id="root"></div><script>window.MOCK_QS=${JSON.stringify(q)}<\/script>${['icons', 'data', 'app'].map((f) => `<script src="${abs(f + '.js')}"><\/script>`).join('')}</body></html>`
          .replace(/&/g, '&amp;')
          .replace(/"/g, '&quot;')
      const KEYS = ['theme', 'img', 'dev', 'view', 'screen']
      function draw() {
        for (const k of KEYS)
          document.querySelectorAll(`#${k} button`).forEach((b) => b.classList.toggle('on', b.dataset.v === st[k]))
        location.hash = new URLSearchParams(st).toString()
        const [, , screen, extra] = SCREENS.find((x) => x[0] === st.screen) ?? SCREENS[0]
        const devs = st.dev === 'both' ? ['desk', 'phone'] : [st.dev]
        const dims = { desk: [1280, 820], phone: [390, 844] }
        document.getElementById('stage').innerHTML = devs
          .map((v) => {
            const [w, h] = dims[v]
            const doc = frameDoc(
              `theme=${st.theme}&img=${st.img}&view=${st.view}&screen=${screen}${extra ? '&' + extra : ''}`,
            )
            return `<div class="frame ${v}"><span>${v === 'desk' ? 'Desktop' : 'Handy'}</span><iframe srcdoc="${doc}" style="width:${w}px;height:${h}px"></iframe></div>`
          })
          .join('')
      }
      for (const k of KEYS)
        document.getElementById(k).addEventListener('click', (e) => {
          if (e.target.dataset.v) {
            st[k] = e.target.dataset.v
            draw()
          }
        })
      draw()
    </script>
  </body>
</html>
